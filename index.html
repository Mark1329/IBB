<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Bingo Board Reference</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        .heading-font {
            font-family: 'Outfit', sans-serif;
        }
        @keyframes pop-in {
            0% { transform: scale(0.85); opacity: 0; }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in {
            animation: pop-in 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col p-2 sm:p-3 md:p-4 bg-slate-950 selection:bg-amber-500 selection:text-black">

    <div class="flex-1 w-full max-w-[1700px] mx-auto flex flex-col md:flex-row gap-2 sm:gap-3 md:gap-4 h-full max-h-full overflow-hidden">
        
    
        <main class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl md:rounded-3xl p-2 sm:p-3 md:p-4 shadow-2xl flex flex-col overflow-hidden">
            
            <div class="grid grid-cols-5 gap-1.5 sm:gap-2 md:gap-3 h-full overflow-hidden">
                
    
                <div class="flex flex-col gap-1 sm:gap-1.5 h-full overflow-hidden">
                    <div class="bg-blue-600 text-white font-black text-sm sm:text-lg md:text-2xl py-1.5 sm:py-2 rounded-xl text-center shadow-md heading-font border border-blue-400/40 flex-shrink-0 tracking-wider">
                        B
                    </div>
                    <div id="col-B" class="flex flex-col gap-1 sm:gap-1.5 flex-1 overflow-hidden"></div>
                </div>

    
                <div class="flex flex-col gap-1 sm:gap-1.5 h-full overflow-hidden">
                    <div class="bg-amber-500 text-slate-950 font-black text-sm sm:text-lg md:text-2xl py-1.5 sm:py-2 rounded-xl text-center shadow-md heading-font border border-amber-300/60 flex-shrink-0 tracking-wider">
                        I
                    </div>
                    <div id="col-I" class="flex flex-col gap-1 sm:gap-1.5 flex-1 overflow-hidden"></div>
                </div>

    
                <div class="flex flex-col gap-1 sm:gap-1.5 h-full overflow-hidden">
                    <div class="bg-red-600 text-white font-black text-sm sm:text-lg md:text-2xl py-1.5 sm:py-2 rounded-xl text-center shadow-md heading-font border border-red-400/40 flex-shrink-0 tracking-wider">
                        N
                    </div>
                    <div id="col-N" class="flex flex-col gap-1 sm:gap-1.5 flex-1 overflow-hidden"></div>
                </div>

    
                <div class="flex flex-col gap-1 sm:gap-1.5 h-full overflow-hidden">
                    <div class="bg-emerald-600 text-white font-black text-sm sm:text-lg md:text-2xl py-1.5 sm:py-2 rounded-xl text-center shadow-md heading-font border border-emerald-400/40 flex-shrink-0 tracking-wider">
                        G
                    </div>
                    <div id="col-G" class="flex flex-col gap-1 sm:gap-1.5 flex-1 overflow-hidden"></div>
                </div>

    
                <div class="flex flex-col gap-1 sm:gap-1.5 h-full overflow-hidden">
                    <div class="bg-indigo-900 text-white font-black text-sm sm:text-lg md:text-2xl py-1.5 sm:py-2 rounded-xl text-center shadow-md heading-font border border-indigo-700/60 flex-shrink-0 tracking-wider">
                        O
                    </div>
                    <div id="col-O" class="flex flex-col gap-1 sm:gap-1.5 flex-1 overflow-hidden"></div>
                </div>

            </div>

        </main>

    
        <aside class="w-full md:w-80 lg:w-96 bg-slate-900 border border-slate-800 rounded-2xl md:rounded-3xl p-3 sm:p-4 flex flex-col justify-between shadow-2xl overflow-y-auto md:overflow-hidden flex-shrink-0 h-full">
            
            <div class="flex flex-col gap-2 flex-1 min-h-0">
                
    
                <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h2 class="text-sm sm:text-base font-bold tracking-wide text-amber-400 heading-font uppercase flex items-center gap-2">
                        <i class="fa-solid fa-trophy text-amber-400"></i> Pattern to Win
                    </h2>
                    <span id="called-count-badge" class="bg-slate-800 text-slate-300 text-xs px-2.5 py-0.5 rounded-full border border-slate-700 font-semibold">
                        Drawn: <span id="called-count" class="text-amber-400 font-bold">0</span>/75
                    </span>
                </div>

    
                <div class="flex flex-col items-center justify-center py-0.5 flex-shrink-0 w-full">
                    <div class="w-full max-w-full bg-slate-950 p-3 rounded-2xl border border-slate-800 shadow-inner flex flex-col gap-1.5">
    
                        <div class="grid grid-cols-5 gap-1 text-center font-black text-xs heading-font">
                            <span class="text-blue-400">B</span>
                            <span class="text-amber-400">I</span>
                            <span class="text-red-400">N</span>
                            <span class="text-emerald-400">G</span>
                            <span class="text-indigo-400">O</span>
                        </div>

    
                        <div id="pattern-grid" class="grid grid-cols-5 gap-1 aspect-square w-full">
    
                        </div>
                    </div>
                </div>

    
                <div class="grid grid-cols-2 gap-2 flex-shrink-0">
                    <button onclick="clearPattern()" class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-slate-300 text-xs font-semibold transition-all cursor-pointer">
                        <i class="fa-solid fa-eraser text-slate-400"></i>
                        <span>Clear Pattern</span>
                    </button>
                    <button onclick="confirmReset()" class="flex items-center justify-center gap-1.5 px-3 py-2 rounded-xl bg-rose-950/50 hover:bg-rose-900 border border-rose-800/60 hover:border-rose-700 text-rose-300 text-xs font-semibold transition-all cursor-pointer">
                        <i class="fa-solid fa-rotate-right text-rose-400"></i>
                        <span>Reset Board</span>
                    </button>
                </div>

    
                <div class="w-full h-32 sm:h-36 md:h-40 mt-2 flex items-center justify-center overflow-hidden rounded-2xl border border-amber-500/30 bg-slate-950 p-1 shadow-lg shadow-amber-950/25 flex-shrink-0">
                    <img src="banner.jpg" 
                        onerror="if (this.src !== 'file:///D:/banner.jpg') { this.src = 'file:///D:/banner.jpg'; } else { this.onerror=null; this.src='banner.jpg'; }" 
                        alt="Event Banner" 
                        class="w-full h-full object-contain rounded-xl">
                </div>

                

            </div>
            
                <div class="w-full text-center mt-1.5 flex-shrink-0">
                    <p class="text-[11px] sm:text-xs text-white tracking-wide">[ Develop by: Posporo / Powered by: STAIT2026 ]</p>
                </div>
        </aside>

    </div>

    
    <div id="modal-backdrop" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div id="modal-box" class="bg-slate-900 border border-slate-800 rounded-3xl p-6 max-w-sm w-full shadow-2xl transform scale-95 opacity-0 transition-all duration-300">
            <div class="w-10 h-10 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-lg mb-3 font-bold">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 class="text-lg font-bold heading-font text-white mb-1.5">Reset Bingo Board?</h3>
            <p class="text-xs text-slate-400 mb-5">This will clear all highlighted numbers on the main board reference.</p>
            <div class="flex items-center justify-end gap-2.5">
                <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold text-xs transition-colors cursor-pointer">
                    Cancel
                </button>
                <button onclick="executeReset()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs shadow-lg shadow-rose-600/30 transition-all cursor-pointer">
                    Yes, Reset
                </button>
            </div>
        </div>
    </div>

    <script>
    
        let calledNumbers = new Set();
        
    
        let patternGrid = Array(5).fill().map(() => Array(5).fill(false));
        
    
        patternGrid[2][2] = true;

    
        function getLetterForNumber(num) {
            if (num <= 15) return 'B';
            if (num <= 30) return 'I';
            if (num <= 45) return 'N';
            if (num <= 60) return 'G';
            return 'O';
        }

    
        function getColumnColorClass(letter, isDrawn) {
            if (!isDrawn) {
                return 'bg-slate-950/70 border-slate-800 text-slate-300 hover:border-slate-600 hover:bg-slate-800/80 hover:text-white';
            }
            switch(letter) {
                case 'B': return 'bg-blue-600 border-blue-400 text-white shadow-lg shadow-blue-600/40 animate-pop-in';
                case 'I': return 'bg-amber-500 border-amber-300 text-slate-950 font-black shadow-lg shadow-amber-500/40 animate-pop-in';
                case 'N': return 'bg-red-600 border-red-400 text-white shadow-lg shadow-red-600/40 animate-pop-in';
                case 'G': return 'bg-emerald-600 border-emerald-400 text-white shadow-lg shadow-emerald-600/40 animate-pop-in';
                case 'O': return 'bg-indigo-900 border-indigo-500 text-white shadow-lg shadow-indigo-900/40 animate-pop-in';
                default: return 'bg-slate-700 text-white';
            }
        }

    
        function buildBoard() {
            const columns = {
                'B': document.getElementById('col-B'),
                'I': document.getElementById('col-I'),
                'N': document.getElementById('col-N'),
                'G': document.getElementById('col-G'),
                'O': document.getElementById('col-O')
            };

            Object.values(columns).forEach(col => col.innerHTML = '');

            for (let i = 1; i <= 75; i++) {
                const letter = getLetterForNumber(i);
                const isDrawn = calledNumbers.has(i);
                
                const btn = document.createElement('button');
                btn.id = `num-cell-${i}`;
                btn.className = `w-full flex-1 rounded-lg sm:rounded-xl font-bold text-xs sm:text-base md:text-xl heading-font border flex items-center justify-center transition-all duration-150 cursor-pointer relative overflow-hidden ${getColumnColorClass(letter, isDrawn)}`;
                btn.onclick = () => toggleNumber(i);
                
                if (isDrawn) {
                    const check = document.createElement('i');
                    check.className = 'fa-solid fa-check text-[10px] sm:text-xs absolute top-1 right-1 opacity-80';
                    btn.appendChild(check);
                }

                const numSpan = document.createElement('span');
                numSpan.textContent = i;
                btn.appendChild(numSpan);

                columns[letter].appendChild(btn);
            }
            document.getElementById('called-count').textContent = calledNumbers.size;
        }

        function toggleNumber(num) {
            if (calledNumbers.has(num)) {
                calledNumbers.delete(num);
            } else {
                calledNumbers.add(num);
            }
            buildBoard();
        }

    
        function buildPatternGrid() {
            const container = document.getElementById('pattern-grid');
            container.innerHTML = '';

            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    const isCenter = (r === 2 && c === 2);
                    const isActive = patternGrid[r][c];
                    
                    const cell = document.createElement('button');
                    cell.type = 'button';
                    cell.onclick = () => togglePatternCell(r, c);
                    
                    let baseClass = "rounded-lg flex items-center justify-center transition-all cursor-pointer font-extrabold border aspect-square ";
                    if (isActive) {
                        baseClass += "bg-amber-500 border-amber-300 text-slate-950 shadow-md shadow-amber-500/30 scale-95";
                    } else {
                        baseClass += "bg-slate-900 border-slate-800 text-slate-600 hover:border-slate-600 hover:bg-slate-800/80";
                    }

                    cell.className = baseClass;
                    
                    if (isCenter) {
                        cell.innerHTML = isActive ? '<i class="fa-solid fa-star text-[11px]"></i>' : '<span class="text-[8px] font-black">FREE</span>';
                    } else if (isActive) {
                        cell.innerHTML = '<i class="fa-solid fa-check text-[10px]"></i>';
                    }

                    container.appendChild(cell);
                }
            }
        }

        function togglePatternCell(r, c) {
            patternGrid[r][c] = !patternGrid[r][c];
            buildPatternGrid();
        }

        function clearPattern() {
            patternGrid = Array(5).fill().map(() => Array(5).fill(false));
    
            patternGrid[2][2] = true;
            buildPatternGrid();
        }

    
        function confirmReset() {
            const modalBackdrop = document.getElementById('modal-backdrop');
            const modalBox = document.getElementById('modal-box');

            modalBackdrop.classList.remove('hidden');
            setTimeout(() => {
                modalBox.classList.remove('scale-95', 'opacity-0');
                modalBox.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeModal() {
            const modalBackdrop = document.getElementById('modal-backdrop');
            const modalBox = document.getElementById('modal-box');
            modalBox.classList.remove('scale-100', 'opacity-100');
            modalBox.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modalBackdrop.classList.add('hidden');
            }, 200);
        }

        function executeReset() {
            calledNumbers.clear();
            buildBoard();
            closeModal();
        }

       
        window.onload = function() {
            buildBoard();
            buildPatternGrid();
        };
    </script>

</body>
</html>
